name: Deploy-docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install deps
        run: |
          python -m pip install -U pip
          python -m pip install ".[docs]"

      - name: Build docs (warnings as errors)
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html

      - name: Disable Jekyll (keeps _static/ and other _ folders)
        run: touch docs/_build/html/.nojekyll

      - name: Upload HTML artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-html
          path: docs/_build/html
          include-hidden-files: true # keep .nojekyll

  deploy:
    needs: build
    # only on pushes to main of the upstream repo; never on PRs or forks
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.repository_owner == 'networkx'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false # the deploy action uses its own token

      - name: Download HTML artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs-html
          path: docs-html

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: docs-html
          branch: gh-pages
